[supervisord]
nodaemon=true
logfile=/tmp/spatial_memory/logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp/spatial_memory/logs

[program:gateway]
command=/opt/conda/envs/gateway/bin/python -m gateway.main
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=10
stdout_logfile=/tmp/spatial_memory/logs/gateway.log
stderr_logfile=/tmp/spatial_memory/logs/gateway.err
environment=PYTHONPATH="/app",GATEWAY_PORT="8080"

[program:sam3]
command=/opt/conda/envs/sam3/bin/python -m sam3_service.main
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=30
stdout_logfile=/tmp/spatial_memory/logs/sam3.log
stderr_logfile=/tmp/spatial_memory/logs/sam3.err
environment=PYTHONPATH="/app:/app/third_party/sam3",SAM3_PORT="8091",WEIGHTS_DIR="/weights"

[program:sam3d]
command=/opt/conda/envs/sam3d/bin/python -m sam3d_service.main
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=30
stdout_logfile=/tmp/spatial_memory/logs/sam3d.log
stderr_logfile=/tmp/spatial_memory/logs/sam3d.err
environment=PYTHONPATH="/app:/app/third_party/sam-3d-objects",SAM3D_PORT="8092",WEIGHTS_DIR="/weights",SAM3D_PATH="/app/third_party/sam-3d-objects",PYTORCH_CUDA_ALLOC_CONF="expandable_segments:True"

[program:foundationpose]
command=/opt/conda/envs/foundationpose/bin/python -m foundationpose_service.main
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=30
stdout_logfile=/tmp/spatial_memory/logs/foundationpose.log
stderr_logfile=/tmp/spatial_memory/logs/foundationpose.err
environment=PYTHONPATH="/app:/app/third_party/FoundationPose",FOUNDATIONPOSE_PORT="8093",WEIGHTS_DIR="/weights",FOUNDATIONPOSE_PATH="/app/third_party/FoundationPose"


